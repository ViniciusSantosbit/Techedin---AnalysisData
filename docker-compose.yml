services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: techedin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techedin"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/techedin
      DB_USER: postgres
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-postgres}
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081,http://localhost:5500,http://127.0.0.1:5500
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ACCOUNT_REQUIRE_VERIFICATION: ${ACCOUNT_REQUIRE_VERIFICATION:-false}
      ACCOUNT_MAIL_MODE: ${ACCOUNT_MAIL_MODE:-disabled}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8081/}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-https://techedin.vercel.app}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
  scraper:
    profiles: ["ingestion"]
    build: ./ingestion
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: techedin
      DB_USER: postgres
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-postgres}
      DB_SSLMODE: disable
      SCRAPER_REMOTIVE_ENABLED: ${SCRAPER_REMOTIVE_ENABLED:-true}
      SCRAPER_NUBANK_ENABLED: ${SCRAPER_NUBANK_ENABLED:-true}
      SCRAPER_CACHE_DIR: /app/.cache/ingestion
    volumes:
      - scraper-cache:/app/.cache/ingestion
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  scraper-cache:
