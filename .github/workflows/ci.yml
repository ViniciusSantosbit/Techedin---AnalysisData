name: Validate and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: techedin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d techedin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ingestion/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r ingestion/requirements.txt
      - run: python tools/check_migrations.py
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s ingestion/tests -v
        env:
          TEST_DB_DSN: host=localhost port=5432 dbname=techedin_test user=postgres password=postgres
      - run: node --test frontend/tests/*.test.mjs
      - run: chmod +x backend/mvnw && cd backend && ./mvnw -B -Pintegration verify
      - run: docker compose config --quiet
      - run: docker compose --profile ingestion build
      - uses: actions/upload-artifact@v4
        with:
          name: techedin-backend
          path: backend/target/backend-*.jar
